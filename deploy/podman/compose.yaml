name: ${COMPOSE_PROJECT_NAME:-mausclaw-podman}
services:
  mausclaw:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/mausclaw-podman:${MAUSCLAW_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${MAUSCLAW_DATA_ROOT:?Run setup.sh first}:${MAUSCLAW_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/mausclaw-podman.sock
    environment:
      HOME: ${MAUSCLAW_DATA_ROOT}
      MAUSCLAW_DATA_DIR: ${MAUSCLAW_DATA_ROOT}/.mausclaw
      MAUSCLAW_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/mausclaw-podman.sock
      MAUSCLAW_PORT: ${MAUSCLAW_PORT:-8799}
      MAUSCLAW_WEBHOOK_PORT: ${MAUSCLAW_WEBHOOK_PORT:-8800}
      MAUSCLAW_PUBLIC_URL: ${MAUSCLAW_PUBLIC_URL:-http://localhost:8080}
      MAUSCLAW_WEBHOOK_PUBLIC_URL: ${MAUSCLAW_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$MAUSCLAW_PORT/api/health | grep -q mausclaw']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      mausclaw:
        condition: service_healthy
    environment:
      MAUSCLAW_HTTP_PORT: ${MAUSCLAW_HTTP_PORT:-8080}
      MAUSCLAW_PORT: ${MAUSCLAW_PORT:-8799}
      MAUSCLAW_WEBHOOK_PORT: ${MAUSCLAW_WEBHOOK_PORT:-8800}
      MAUSCLAW_HTTPS_HOST: ${MAUSCLAW_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
